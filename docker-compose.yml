version: '3.8'
services:
  # Application service
  web:
    build:
      context: .
      args:
        requirements_file: ./requirements.txt
    environment:
      - DATABASE_URL=mongodb://mongodb:27017
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    volumes:
      - .:/src
      - ./data:/data
    depends_on:
      - mongodb
    restart: always
    networks:
      - app-network

  # MongoDB Database
  mongodb:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
      - ./db_confs/mongod.conf:/etc/mongo/mongod.conf
    command: [ "mongod", "--config", "/etc/mongo/mongod.conf" ]
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
